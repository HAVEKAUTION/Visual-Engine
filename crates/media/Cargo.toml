[package]
name = "media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
serde_json.workspace = true
log.workspace = true

# Cameras: Media Foundation (Windows), AVFoundation (macOS), V4L2 (Linux).
[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-msmf"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-avfoundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-v4l"] }
